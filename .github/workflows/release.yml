name: Release

# Bundling has to happen on the target OS: the Windows installer needs WebView2,
# the MSVC toolchain, and the WiX/NSIS bundlers, none of which exist on macOS.
# Tagging `v*` produces downloadable installers; `workflow_dispatch` produces the
# same artifacts without publishing a release.
#
# `TAURI_SIGNING_PRIVATE_KEY` is required for `tauri build`: the bundle config
# enables `createUpdaterArtifacts`, which signs the NSIS/MSI update payloads.
# Configure it as a repository secret (the private key has no password).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: Bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]

    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      # The signing key was generated without a password (minisign keybox); an
      # explicit empty value keeps the bundler from prompting interactively.
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust toolchain
        shell: bash
        run: |
          CHANNEL="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "${CHANNEL}" --profile minimal --component rustfmt,clippy
          rustup default "${CHANNEL}"

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-release-${{ hashFiles('Cargo.lock') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers
        run: pnpm build

      - name: Enforce compact Windows installers
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          readonly MAX_INSTALLER_BYTES=$((50 * 1024 * 1024))
          for installer in \
            target/release/bundle/nsis/*-setup.exe \
            target/release/bundle/msi/*.msi; do
            test -f "$installer" || { echo "Installer not found: $installer" >&2; exit 1; }
            size="$(wc -c < "$installer")"
            echo "$(basename "$installer"): $size bytes"
            if (( size > MAX_INSTALLER_BYTES )); then
              echo "Installer exceeds the 50 MiB release limit: $installer" >&2
              exit 1
            fi
          done

      # Tauri v2 reuses the NSIS installer itself as the update payload and
      # emits its signature beside it (`*-setup.exe.sig`). The manifest can
      # therefore only be generated on the Windows runner. The
      # release is intentionally NOT a prerelease: GitHub's `/releases/latest`
      # download URL skips prereleases, and that URL is the update endpoint.
      - name: Generate updater manifest
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").version')"
          INSTALLER="$(find target/release/bundle/nsis -name '*-setup.exe' | head -1)"
          test -n "$INSTALLER" || { echo "NSIS installer not found" >&2; exit 1; }
          SIG="${INSTALLER}.sig"
          test -f "$SIG" || { echo "Signature $SIG not found" >&2; exit 1; }
          echo "Update payload: $INSTALLER"
          node - "$VERSION" "$INSTALLER" "$SIG" <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");

          const [version, installerPath, signaturePath] = process.argv.slice(2);
          const asset = path.basename(installerPath);
          const manifest = {
              "version": version,
              "notes": "TokenBuddy automatic update",
              "pub_date": new Date().toISOString(),
              "platforms": {
                  "windows-x86_64": {
                      "signature": fs.readFileSync(signaturePath, "utf8").trim(),
                      "url": `https://github.com/Yessi-cmd/TokenBuddy/releases/download/v${version}/${asset}`,
                  }
              },
          };
          fs.writeFileSync("latest.json", `${JSON.stringify(manifest, null, 2)}\n`);
          EOF

      # The bundle layout differs per OS (msi/nsis vs dmg/macos), so the whole
      # bundle directory plus the updater manifest is uploaded and the release
      # job picks the installers and update payloads.
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: tokenbuddy-${{ matrix.os }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.zip
            target/release/bundle/msi/*.sig
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.zip
            target/release/bundle/nsis/*.sig
            target/release/bundle/dmg/*.dmg
            latest.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          find bundles -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.sig' -o -name 'latest.json' \) -print
          # Not a prerelease: GitHub's `/releases/latest/download` URL — the
          # in-app updater's endpoint — does not resolve to prereleases. The
          # installers remain unsigned; SmartScreen will still prompt.
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "TokenBuddy ${GITHUB_REF_NAME}" \
            --notes "$(cat <<'NOTES'
          本地优先的 AI 编程 Token 观测工具。安装包由 GitHub Actions 在对应系统上构建，应用内自动更新已启用（Windows）。

          ## 安装

          - Windows：下载 `.msi` 或 `-setup.exe`。安装包**未签名**，SmartScreen 会提示"Windows 已保护你的电脑"，需点击"更多信息"→"仍要运行"。若系统尚未安装 WebView2，安装器会联网下载 Microsoft WebView2 Bootstrapper；已有 WebView2 时不会重复下载。
          - macOS：下载 `.dmg`。同样未签名，首次打开需在"系统设置 → 隐私与安全性"中放行。

          ## 自动更新

          - Windows 版启动后会在后台检查本 Release 的 `latest.json`，发现新版本时弹出更新确认，下载安装完成后自动重启。
          - 检查失败（离线、GitHub 不可达等）只记录日志，不影响采集。
          - macOS 自动更新未启用。

          ## 已知限制

          - Windows 上的托盘交互、开机自启和路径选择器**尚未在真机验证**，CI 只保证能编译通过。
          - Codex 官方账号识别只反映 `auth.json` 中当前登录的账号；检测到 Cockpit 多账号环境时会主动放弃账号与额度归因，避免把多个账号的用量算到同一个账号头上。
          - OTel 当前支持可选的 loopback OTLP/HTTP traces；不支持 gRPC/metrics/logs，本地代理仍未实现。
          - 成本估算只对已知 Provider + Model 价格卡生效；第三方中转和缺少必要字段的费用保持 `N/A`。
          - 本版本移除内嵌的 WebView2 离线安装器，显著缩小 Windows MSI/EXE，并新增 50 MiB 发布体积上限，防止安装包再次异常膨胀。
          NOTES
          )" \
            $(find bundles -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.sig' -o -name 'latest.json' \))
