[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/domain",
    "crates/storage",
    "crates/adapters/codex-session",
    "crates/adapters/claude-session",
    "crates/adapters/cc-switch",
    "crates/adapters/cockpit",
    "crates/adapters/opencode",
    "crates/adapters/official-quota",
    "crates/adapters/sqlite-source",
    "crates/otel-receiver",
    "crates/core",
]
resolver = "3"

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.93"

[workspace.dependencies]
chrono = { version = "0.4.41", features = ["clock", "serde"] }
notify = "8.2.0"
reqwest = { version = "0.13.4", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "0.37.0", features = ["bundled"] }
sha2 = "0.10.9"
thiserror = "2.0.17"
tauri = { version = "2.11.5", features = ["tray-icon", "macos-private-api"] }
tauri-build = "2.6.3"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.10.1"
tempfile = "3.23.0"
tokenbuddy-domain = { path = "crates/domain" }
tokenbuddy-sqlite-source = { path = "crates/adapters/sqlite-source" }
tokenbuddy-opencode = { path = "crates/adapters/opencode" }
tokenbuddy-storage = { path = "crates/storage" }
