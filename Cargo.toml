[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/domain",
    "crates/storage",
    "crates/adapters/codex-session",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[workspace.dependencies]
chrono = { version = "0.4.41", features = ["clock", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "0.37.0", features = ["bundled"] }
sha2 = "0.10.9"
tauri = "2.11.5"
tauri-build = "2.6.3"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokenbuddy-domain = { path = "crates/domain" }
tokenbuddy-storage = { path = "crates/storage" }
