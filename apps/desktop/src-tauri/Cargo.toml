[package]
name = "tokenbuddy-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "tokenbuddy_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tokenbuddy-desktop"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build.workspace = true

[dependencies]
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-autostart.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-updater.workspace = true
tokenbuddy-codex-session = { path = "../../../crates/adapters/codex-session" }
tokenbuddy-claude-session = { path = "../../../crates/adapters/claude-session" }
tokenbuddy-cc-switch = { path = "../../../crates/adapters/cc-switch" }
tokenbuddy-cockpit = { path = "../../../crates/adapters/cockpit" }
tokenbuddy-opencode = { path = "../../../crates/adapters/opencode" }
tokenbuddy-core = { path = "../../../crates/core" }
tokenbuddy-domain.workspace = true
tokenbuddy-storage.workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.10.1"

[dev-dependencies]
tempfile.workspace = true
# Tauri's MockRuntime lets the command layer be exercised headlessly. On
# Windows the test binary needs the Common Controls v6 manifest to load at all
# (see build.rs) — that is why the manifest is emitted for test targets.
tauri = { workspace = true, features = ["test"] }
