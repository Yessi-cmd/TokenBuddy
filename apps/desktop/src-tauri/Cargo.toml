[package]
name = "tokenbuddy-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "tokenbuddy_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-autostart.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-single-instance.workspace = true
tokenbuddy-codex-session = { path = "../../../crates/adapters/codex-session" }
tokenbuddy-claude-session = { path = "../../../crates/adapters/claude-session" }
tokenbuddy-cc-switch = { path = "../../../crates/adapters/cc-switch" }
tokenbuddy-cockpit = { path = "../../../crates/adapters/cockpit" }
tokenbuddy-core = { path = "../../../crates/core" }
tokenbuddy-domain.workspace = true
tokenbuddy-storage.workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.55.0"

[dev-dependencies]
# The mock runtime lets the command layer be exercised headlessly. It is a
# dev-only feature of the dependency already in use, so the shipped binary is
# unchanged.
tauri = { workspace = true, features = ["test"] }
tempfile.workspace = true
